<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MyNotify</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<fieldset class="inputForm">
  <legend>Создайте уведомление</legend>
  <div class="timeRow">
    <label>
      <input
          type="text"
          id="reminderTitle"
          placeholder="Название (созвон, обед, задача...)"
          maxlength="50"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
      />
    </label>
    <div class="currentTime">
      <strong>Время:</strong>
      <span id="currentTime">--:--</span>
    </div>
  </div>

  <div class="timeRow formRow">
    <label>
      <strong>Время:</strong>
      <input type="time" id="reminderTime" value="09:00">
    </label>

    <div class="days">
      <strong>Дни:</strong>
      <label><input type="checkbox" name="day" value="1" checked> Пн</label>
      <label><input type="checkbox" name="day" value="2" checked> Вт</label>
      <label><input type="checkbox" name="day" value="3" checked> Ср</label>
      <label><input type="checkbox" name="day" value="4" checked> Чт</label>
      <label><input type="checkbox" name="day" value="5" checked> Пт</label>
      <label><input type="checkbox" name="day" value="6"> Сб</label>
      <label><input type="checkbox" name="day" value="0"> Вс</label>
    </div>

    <label>
      <strong>Звук:</strong>
      <select id="reminderSound">
        <option value="111.mp3">Мелодичный</option>
        <option value="222.mp3">Сигнал</option>
        <option value="333.mp3">Тревога</option>
        <option value="none">Без звука</option>
      </select>
    </label>
  </div>

  <div class="formActions">
    <button id="addReminderBtn" class="btnAccept">Добавить напоминание</button>

    <!-- Тест уведомления + восстановление из синхронизированного бэкапа -->
    <button id="testNotificationBtn" class="btnSecondary">🔔 Тест</button>
    <button id="restoreBackupBtn" class="btnSecondary">♻️ Восстановить</button>
  </div>
</fieldset>

<article>
  <p class="listHeader"><span>📋</span> <span>Мои напоминания</span></p>

  <section id="remindersList" class="remindersList">
    <div class="empty-state">Нет напоминаний</div>
  </section>
</article>

<script src="popup.js"></script>
</body>
</html>
